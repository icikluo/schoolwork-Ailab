<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>规则层浏览器对拍 · 真实 JS</title>
<style>
  body { font-family:"Microsoft YaHei",system-ui,sans-serif; padding:24px; background:#F4F1E8; color:#2C2C2A; }
  pre { background:#fff; border:1px solid #E5E2D5; border-radius:9px; padding:14px; font-size:13px; line-height:1.6; }
</style>
</head>
<body>
<h1 style="font-size:18px;font-weight:500">规则层浏览器对拍（真实 养成.js）</h1>
<p style="font-size:13px;color:#6F6D64">本页在 file:// 下直接加载三个本地 js，用真实 JS 跑关键用例；结果供 测试/核对养成.py 的 Python 复刻对照。</p>
<pre id="结果">正在执行…</pre>

<script src="../数据/装扮.js"></script>
<script src="../数据/家具.js"></script>
<script src="../养成.js"></script>
<script>
(function () {
  "use strict";
  var S = window.养成系统;
  var 条目 = [];

  function 等于(a, b) {
    if (a === b) return true;
    if (typeof a !== typeof b) return false;
    if (a && typeof a === "object") {
      var ka = Object.keys(a).sort(), kb = Object.keys(b).sort();
      if (ka.length !== kb.length) return false;
      for (var i = 0; i < ka.length; i++) {
        if (ka[i] !== kb[i] || !等于(a[ka[i]], b[kb[i]])) return false;
      }
      return true;
    }
    return false;
  }
  function 查(名, 实际, 期望) {
    条目.push({ "名": 名, "通过": 等于(实际, 期望), "实际": 实际, "期望": 期望 });
  }

  if (!S) {
    document.getElementById("结果").textContent = "失败：window.养成系统 未挂载（养成.js 可能语法错误或未加载）";
    return;
  }

  // 数据文件确实被加载
  var 件数 = Object.keys(window.装扮数据).reduce(function (n, k) { return n + window.装扮数据[k].length; }, 0);
  查("装扮数据 38 件", 件数, 38);
  查("家具数据 6 件", window.家具数据.length, 6);
  查("家具加成合计 0.35", Math.round(window.家具数据.reduce(function (n, f) { return n + f.加成; }, 0) * 100) / 100, 0.35);

  // 默认数据
  var a = S.默认存档();
  var d = S.默认每日("2026-11-16");
  查("默认存档 Lv.1 / 0 经验", [a.经验, a.金币, a.连续天数], [0, 0, 0]);
  查("默认形象 11 个部件", Object.keys(a.形象).length, 11);
  查("默认已购 = 免费件", a.已购.length, 19);
  查("默认每日 6 个字段", Object.keys(d).length, 6);

  // 等级曲线
  [[0,1,0,100],[99,1,99,100],[100,2,0,200],[299,2,199,200],[300,3,0,300],
   [4499,9,899,900],[4500,10,0,0],[99999,10,0,0]].forEach(function (c) {
    var r = S.由经验算等级(c[0]);
    查("经验 " + c[0] + " → 等级/级内/需要", [r.等级, r.级内经验, r.升级需要], [c[1], c[2], c[3]]);
  });
  查("满级后星星 4500/5000/7500", [S.星级(4500), S.星级(5000), S.星级(7500)], [0, 1, 6]);

  // 日期与连签
  查("相差天数（本地日历）", S.相差天数("2026-11-15", "2026-11-16"), 1);
  查("跨月 +1", S.相差天数("2026-10-31", "2026-11-01"), 1);
  查("首次连签 → 1", S.更新连续天数(null, "2026-11-16", 0), 1);
  查("昨天 → +1", S.更新连续天数("2026-11-15", "2026-11-16", 5), 6);
  查("断 2 天 → 1", S.更新连续天数("2026-11-14", "2026-11-16", 5), 1);
  查("时钟回拨 → 不变", S.更新连续天数("2026-11-20", "2026-11-16", 5), 5);

  // R1 / R2
  查("晚 22 点在窗内", S.校验餐次时间窗("晚", 22), true);
  查("晚 3 点在窗内", S.校验餐次时间窗("晚", 3), true);
  查("早 12 点不在窗内", S.校验餐次时间窗("早", 12), false);
  查("R1 加餐兜底为晚", S.归一化来源("加餐", d, {}).来源, "晚");
  查("R1 已有晚则不打卡", S.归一化来源("加餐", { "三餐": ["晚"] }, {}).结果, "不打卡");
  查("R2 强制晚卡在 8 点被拦", S.归一化来源("晚", d, { "强制": true, "小时": 8 }).结果, "未到餐点");
  查("非法来源", S.归一化来源("火锅", d, {}).结果, "无效来源");

  // 结算打卡
  var r = S.结算打卡(a, d, "早");
  查("早餐 +20/+5", r.获得, { "经验": 20, "金币": 5 });
  查("早餐写三餐与连签", [r.每日.三餐, r.存档.连续天数], [["早"], 1]);
  查("同一餐再打 → 0", S.结算打卡(r.存档, r.每日, "早").获得, { "经验": 0, "金币": 0 });
  查("家具加成 0.35 → 金币 7", S.结算打卡(a, d, "早", { "家具加成": 0.35 }).获得.金币, 7);
  查("加成 0.9 封顶 → 金币 8", S.结算打卡(a, d, "早", { "家具加成": 0.9 }).获得.金币, 8);

  var a2 = S.默认存档(), d2 = S.默认每日("2026-11-16");
  ["早", "午", "晚"].concat(Array(8).fill("喝水"), Array(3).fill("运动")).forEach(function (s) {
    var x = S.结算打卡(a2, d2, s, { "今天": "2026-11-16" });
    a2 = x.存档; d2 = x.每日;
  });
  查("打满一天 240 经验 / 67 金币", [a2.经验, a2.金币], [240, 67]);
  查("达标标记一次", d2.达标, true);
  查("水 6 / 运动 1 即达标", S.每日是否达标({ "三餐": ["早","午","晚"], "喝水": 6, "运动": 1 }), true);

  var a3 = S.默认存档(), d3 = S.默认每日("2026-11-16");
  ["早","午"].concat(Array(6).fill("喝水"), ["运动"]).forEach(function (s) {
    var x = S.结算打卡(a3, d3, s, { "今天": "2026-11-16" });
    a3 = x.存档; d3 = x.每日;
  });
  var r3 = S.结算打卡(a3, d3, "晚", { "今天": "2026-11-16" });
  查("第 3 餐触发达标 → 70/25", r3.获得, { "经验": 70, "金币": 25 });
  查("是否刚达标", r3.是否刚达标, true);

  var a4 = S.默认存档(), d4 = S.默认每日("2026-11-16");
  for (var i = 0; i < 8; i++) { var x4 = S.结算打卡(a4, d4, "喝水"); a4 = x4.存档; d4 = x4.每日; }
  查("喝水第 9 次已上限", S.结算打卡(a4, d4, "喝水").结果, "已上限");

  var a5 = S.默认存档(); a5.经验 = 90;
  查("90+20 → 升 1 级", S.结算打卡(a5, S.默认每日("2026-11-16"), "早").升了几级, 1);
  var a6 = S.默认存档(); a6.经验 = 800; a6.金币 = 300; a6.上次打卡日 = "2026-11-10";
  var r6 = S.结算打卡(a6, S.默认每日("2026-11-16"), "早", { "今天": "2026-11-16" });
  查("断签不扣经验金币", [r6.存档.经验, r6.存档.金币, r6.存档.连续天数], [820, 305, 1]);

  // 宠物 / 家具 / 场景
  查("宠物三项全达成 → 开心", S.宠物心情({ "三餐": ["早","午","晚"], "喝水": 6, "运动": 1 }, a).心情, "开心");
  查("宠物都没做 → 有点想你", S.宠物心情(d, a).心情, "有点想你");
  查("家具加成六件 0.35", Math.round(S.家具加成(window.家具数据.map(function (f) { return f.id; })) * 100) / 100, 0.35);
  查("家具加成重复只算一次", S.家具加成(["家具-木桌","家具-木桌"]), 0.05);

  var s = S.默认场景();
  查("默认场景 6 槽空", s.家具.filter(function (x) { return !x; }).length, 6);
  var b1 = S.摆放家具(s, 0, "家具-木桌");
  查("摆木桌 → 已摆放", b1.结果, "已摆放");
  查("木桌坐标", [b1.场景.家具[0].x, b1.场景.家具[0].z], [-1.15, 0.1]);
  查("同件摆另一槽 → 重复", S.摆放家具(b1.场景, 1, "家具-木桌").结果, "重复");
  查("槽位 6 → 无效", S.摆放家具(s, 6, "家具-木桌").结果, "槽位无效");
  var s2 = s;
  window.家具数据.forEach(function (f, i) { s2 = S.摆放家具(s2, i, f.id).场景; });
  查("摆满 6 件加成 0.35", Math.round(S.场景加成(s2) * 100) / 100, 0.35);

  // 反节食：任意输入奖励非负
  var 负 = 0;
  for (var k = 0; k < 200; k++) {
    var 来源 = ["早","午","晚","喝水","运动","达标","加餐","火锅"][k % 8];
    var aa = S.默认存档(); aa.经验 = k * 37;
    var dd = S.默认每日("2026-11-16");
    dd.喝水 = k % 9; dd.运动 = k % 4;
    var rr = S.结算打卡(aa, dd, 来源, { "家具加成": (k % 21) / 10 - 0.5 });
    if (rr.获得.经验 < 0 || rr.获得.金币 < 0 || rr.存档.经验 < aa.经验) 负++;
  }
  查("200 组奖励恒非负、经验不倒退", 负, 0);

  var 通过 = 条目.filter(function (t) { return t.通过; }).length;
  var 失败 = 条目.length - 通过;
  var 行 = 条目.filter(function (t) { return !t.通过; }).map(function (t) {
    return "  ✗ " + t.名 + "：实际 " + JSON.stringify(t.实际) + "，期望 " + JSON.stringify(t.期望);
  });
  document.getElementById("结果").textContent =
    "window.养成系统 已挂载，导出函数 " + Object.keys(S).length + " 个\n" +
    "通过 " + 通过 + " 项，失败 " + 失败 + " 项\n" +
    (行.length ? 行.join("\n") : "全部与 Python 复刻的期望值一致");
  window.对拍结果 = { "通过": 通过, "失败": 失败 };
})();
</script>
</body>
</html>
